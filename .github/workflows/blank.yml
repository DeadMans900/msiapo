# **4. Функциональные требования**

## **4.1. Разделы портала (после авторизации)**

### **4.1.1. Главная страница**

- Новости организации, календарь событий организации (связан с бронированием залов), карточка дежурных служб на сутки (дежурный врач, ответственный администратор, охрана, эпидемиолог, ответственный за ГО — по справочнику, ведёт АХЧ/АСУ).

- Блок внешних ссылок: перечень ссылок (МИС: ЕЦП, L2, ТМК; ФРМО/ФРЛР; ЕГИСЗ; веб-доступ «Деловой почты» и др.) добавляется и изменяется администратором через форму — без привлечения разработки.

- Индикатор непрочитанных уведомлений (центр уведомлений, раздел 4.16).

### **4.1.2. Навигация и поиск**

- Боковое меню с учётом назначенных ролей; сквозной поиск по доступным пользователю документам и записям.

- Адаптивная вёрстка; приоритет мобильного удобства — регистрация НС и подача заявок HelpDesk должны быть полностью работоспособны со смартфона (фиксируется как требование приёмки).

### **4.1.3. Телефонный справочник**

- Записи: подразделение, кабинет, ФИО, должность, внутренний телефон, e-mail. Поиск и фильтр по подразделению. Ведение — АСУ.

### **4.1.4. Приказы организации**

- Реестр приказов: номер, дата, наименование, тип, подразделения, файл PDF; поиск; только актуальные версии.

- Ознакомление под роспись: у приказа с отметкой «обязательно к ознакомлению» формируется список сотрудников, отметка об ознакомлении фиксируется с датой; отчёт «кто не ознакомился» — руководителю подразделения и в отдел кадров.

### **4.1.5. Приказы Минздрава (приказы-связки)**

- Реестр с привязкой внутренних приказов к приказам Минздрава; переход «внутренний → приказ-основание» и обратно.

### **4.1.6. СОПы**

- Каждый СОП: актуальная версия с датой введения, история версий, вложение, привязка к приказу о введении, разделам и должностям.

- Ознакомление под роспись обязательно (решено): список сотрудников, отметки, отчёт по неознакомленным.

- Связка с НС: в НС с характером «Не работает СОП» есть поле выбора СОПа; из карточки СОПа — список связанных НС.

### **4.1.7. Библиотека нормативных документов**

- Клинические рекомендации, стандарты, инструкции по охране труда и пожарной безопасности — единая подсистема по принципу актуальных версий (как СОПы): документ, версия, дата введения, вложения, поиск.

### **4.1.8. Расписание залов и открытые уроки**

- Бронирование залов/переговорных с проверкой пересечений, списком участников, уведомлениями; раздел «открытые уроки» — по существующей практике.

### **4.1.9. Доска объявлений по подразделениям**

- Публикация — руководителями подразделений и администраторами; автоснятие по сроку; лента с фильтром по подразделению.

### **4.1.10. Справочник дежурных служб и графики дежурств**

- Карточка дежурных на сутки — на главной.

- Графики дежурств врачей и среднего персонала — полноценный планировщик (решено): электронные графики по подразделениям, редактирование руководителями, публичное представление сотрудникам; напоминание о своей смене.

### **4.1.11. Календарь событий организации**

- Общие события (планёрки, совещания, заседания ВКК, учёба) + события, созданные при бронировании залов; представление по подразделениям и датам.

### **4.1.12. Обратная связь / горячая линия качества**

- Кнопка «Сообщить о проблеме» с формой (подразделение, описание, вложения, анонимно/от имени); маршрут к менеджеру качества; из обращения возможна регистрация НС или заявки HelpDesk.

### **4.1.13. Раздел «Я новенький»**

- Справочный раздел для новых сотрудников: как получить доступы, к кому обращаться, где что находится, полезные контакты и ссылки. Наполнение — администраторы и HR.

### **4.1.14. Раздел ГО и ЧС**

- Инструкции на случай пожара, отключения электроэнергии, эвакуации и других ЧС; схемы действий; планы тренировок; составы штабов. Ведение — заместитель главного врача по ГО и мобилизационной работе.

- Массовое оповещение по e-mail при ЧС — на основе механизма рассылок административной панели (только e-mail, решено).

### **4.1.15. Протоколы заседаний**

- Хранение протоколов ВКК, комиссий, планёрок: дата, участники, вложения, поиск; связка с модулем поручений (поручения из протокола).

## **4.2. Служба заявок на обслуживание (HelpDesk) — три сегмента**

| **Сегмент** | **Очередь операторов** | **Категории заявок (сводно)** |
| - | - | - |
| IT | специалисты АСУ | не работает ПК/принтер/СБИС, замена картриджа, доступы, телефония, расходные материалы для оргтехники |
| АХЧ | АХЧ | электрика, сантехника, уборка, мебель, закупка хозматериалов, транспорт (подача машины, рейсы — категории уточнить у зама по хозчасти) |
| МедТехника | медицинские инженеры | поломка медицинского оборудования, плановое ТО, поверка/калибровка, подключение/установка/перемещение, консультация по эксплуатации, списание |


- Механизм заявок единый: форма (категория, описание, вложения, подразделение/кабинет, привязка к объекту), статусы (создана → принята → в работе → выполнена → закрыта; возвращение инициатору), SLA-таймеры, уведомления на e-mail, кабинеты «мои заявки» и очередь оператора.

- Списание расходных материалов (картриджи, IT-склад) — только через заявки сегмента IT.

- АХЧ-инвентарь (решено): возможность ведения реализуется с запуском, справочник заполняется по мере готовности АХЧ — объекты (мебель, не-ИТ оргтехника) добавляются по мере инвентаризации.

## **4.3. Связи «НС ↔ заявка HelpDesk»**

- Связь всегда опциональна (решено): после выбора характера НС система предлагает создать связанную заявку в рекомендованном сегменте — сотрудник может отказаться или выбрать другой сегмент вручную.

- Матрица автоподсказки сегмента (подлежит проверке службами — открытый вопрос): Поломка медицинского оборудования → МедТехника; Неправильная работа систем жизнеобеспечения → МедТехника; Инциденты с интернетом → IT; Инциденты с МИС (ЕЦП, L2, ТМК и др.) → IT; Утечка конфиденциальной информации → IT; Нарушение правил безопасности (несанкционированный доступ) → выбор IT/АХЧ; остальные — без автоподсказки.

- При создании связанной заявки поля переносятся автоматически: подразделение, описание, объект (карточка ПК/медоборудования), вложения.

- Обратная связь: из заявки HelpDesk можно привязать существующее НС или создать новое.

- В карточках с обеих сторон — взаимные ссылки и статусы; при закрытии связанной заявки — уведомление автору НС и менеджеру качества (статус НС не меняется автоматически).

- Права: создавать связь — автор НС и менеджер качества; изменять/удалять — только менеджер качества.

## **4.4. Учёт нежелательных событий (НС)**

- Регистрация НС по формам классификатора (Приложение 2: 9 групп характера событий). Поля: дата/время, подразделение (выборка: блок → подразделение со строкой поиска), характер, описание, лица/пациенты (минимальный набор без диагнозов), вклад «не работает СОП» со ссылкой на СОП.

- Вложения: фото и PDF до 20 МБ.

- Отработка менеджером качества: назначение ответственного, срок, заключение, мероприятия; статусы от «зарегистрировано» до «закрыто».

- Личный кабинет «мои события»; реестр с фильтрами; аналитика (динамика, топ характеров, карта по подразделениям, периодика); экспорт в Excel.

- Реестр рисков: выявленные риски (не свершившиеся события) с полями по той же модели: подразделение, характер риска, вероятность/последствия (шкала — уточнить), мероприятия, ответственный, срок, статус.

- Связи с заявками HelpDesk (раздел 4.3), с ходатайствами на закупку (замена оборудования), с карточками медтехники и ПК.

- Архив закрытых событий с поиском; импорт истории из существующих таблиц Excel (разовое требование первой очереди).

- ПДн (решено): портал не хранит данные о здоровье/диагнозах — только минимальный набор из формы НС; учесть в модели угроз.

## **4.5. Согласование документов и подписание УКЭП**

- Маршруты согласования по вертикали «исполнитель → заведующий отделением → заместитель главного врача по направлению → главный врач» с автоподстановкой по подразделению из справочника; конструктор типовых маршрутов; этапы: согласен/отказать с комментарием/на доработку.

- Подписание УКЭП (решения: криптопровайдер — КриптоПро; охват — примерно 70% персонала):

- — плагин КриптоПро ЭЦП Browser plug-in; криптопровайдер КриптоПро CSP; подпись по ГОСТ Р 34.10-2012 (отсоединённая или совмещённая);

- — этап, требующий подписи, выполняется личным сертификатом владельца; фиксируются: кто, когда, серийный номер сертификата, файл подписи; делегирование запрещено;

- — проверка срока действия и целостности подписи; при отсутствии/просрочке сертификата этап не пропускается, выводится понятная ошибка;

- — пользователи без УКЭП проходят те же этапы визированием без ЭП; точный перечень должностей, обязанных подписывать УКЭП, уточняет отдел кадров (настройка на внедрении).

- Реестр сертификатов: ФИО, сертификат, дата окончания; сверка с учётной записью; уведомления владельцу на e-mail за 30, 14, 7 и 3 дня до истечения; при истечении — уведомление владельцу и администратору, роль «подписант» блокируется до обновления; реестр в админ-панели с подсветкой истекающих.

- Журнал подписей по каждому документу; генерация PDF подписанных документов.

## **4.6. Обработка документов МСЭ**

- Интеграция с ViPNet «Деловой почтой»: входящие письма с вложениями МСЭ попадают в каталог на сервере; система разбирает каталог и регистрирует документы.

- Регистратор МСЭ: обработка, статусы, история, уведомления. Резервный ручной режим загрузки при недоступности каталога.

## **4.7. Дашборд личных показателей**

- Персональная сводка: сроки (пароль, сертификат, аккредитация, допуски), поручения с активными сроками, мои заявки/НС/ходатайства по статусам, ближайшие смены/события.

## **4.8. Учёт IT-инфраструктуры (сегмент IT)**

- Инвентарные карточки ПК и техники: тип, модель, серийный/инвентарный номер, подразделение/кабинет, ответственный, статус, вложения (паспорт, гарантия).

- Склад расходных материалов (картриджи и пр.): номенклатура, приход/расход/остатки; списание только по заявкам сегмента IT; полный доступ на заполнение — только операторы IT.

- Реестр лицензий и сроки действия; инвентаризация с выгрузкой в Excel.

## **4.9. Учёт медицинского оборудования (сегмент МедТехника)**

- Инвентарная карточка медизделия: инвентарный и заводской номер, наименование/модель/производитель, дата ввода, срок службы, класс (по номенклатуре), расположение, ответственный, статус (в эксплуатации/в ремонте/на складе/утилизирован), документы (паспорт, РУ, гарантия, сервисные договоры).

- График планового ТО по регламенту производителя; срок поверки для средств измерений с напоминаниями за 30/14/7/3 дня; просроченная поверка подсвечивается в карточке и сводке.

- Журналы ТО/поверок/ремонтов с вложением актов; история ремонтов с исполнителями и стоимостью.

- Связи: заявки сегмента МедТехника, ходатайства на закупку (дефектный акт), НС по характеру «Поломка медицинского оборудования».

- Первичный импорт реестра из Excel (разовое требование).

## **4.10. Бронирование залов**

- Календарь залов/переговорных, бронирование с проверкой пересечений, участники, уведомления; события переносятся в календарь организации.

## **4.11. Административная панель**

- Управление пользователями (раздел 6), реестр сертификатов УКЭП, справочники (подразделения, категории заявок, направления ВКК, инициаторы закупок, состав комиссии), настройки сроков и SLA, шаблоны PDF-макетов.

- Журналы безопасности: входы (кто, когда, IP), неудачные попытки, изменения ролей; список записей с истекающим паролем и заблокированных.

- Массовые рассылки по e-mail (подразделение/все/роль).

- Тестовый контур из состава ТЗ исключён (решено) — вопросы тестирования обсуждаются на этапе договора.

## **4.12. Контроль сроков аккредитации и допусков персонала**

- Карточки документов на сотрудниках: аккредитация специалистов, сертификаты НМО/повышения квалификации, профосмотры, санминимум, допуски к манипуляциям — с датой окончания и вложением.

- Личный кабинет сотрудника: свои сроки; напоминания за 30/14/7/3 дня; при истечении — уведомление сотруднику, руководителю подразделения и кадровой службе.

- Отчёты для руководителей и кадровой службы: истекающие в N дней, просроченные, по подразделениям.

## **4.13. HR-модуль**

- Заявки на отпуск, заявки на справки (2-НДФЛ, с места работы) — реестр с маршрутами в отдел кадров.

- Дни рождения и поздравления — лента на главной.

- Интеграция с 1С:ЗУП на момент создания отсутствует (решено); архитектура предусматривает возможность будущей интеграции (открытый вопрос — уточнить техническую возможность у АСУ в перспективе). До интеграции — ручной реестр.

## **4.14. Закупочная деятельность**

### **4.14.1. Ходатайства на закупку**

- Пять типов ходатайств по утверждённым шаблонам (Приложения 5–9): товар; работы/услуги; медицинское оборудование; изменение условий действующего договора; общая форма от структурного подразделения.

- Формы повторяют поля бумажных бланков: таблицы позиций (наименование с товарным знаком, КОСГУ, количество/ед. изм., подразделения, предварительная стоимость, ОКПД2 и национальный режим — заполняют специалисты по закупкам); блоки бухгалтера материальной группы (остатки в отделении и на складе, расход за период) заполняются на этапе бухгалтерии и не видны инициатору до заполнения.

- Требование национального режима: характеристики в ТЗ указываются диапазонами (не более/не менее), чтобы диапазон включал как российские, так и импортные товары (с 01.01.2025 требования ужесточены).

- Поле «жизненно угрожающая ситуация: да/нет» с обоснованием; при «да» — ускоренный маршрут и приоритет в очереди; запуск ускоренного маршрута — главный врач (решено; закрепить приказом — см. напоминание в итогах рабочей группы).

- Маршруты по типам (в соответствии с инструкциями): товар — инициатор → специалист по закупкам (ОКПД2, нацрежим) → бухгалтерия (остатки, КОСГУ) → ПЭО → комиссия по способу закупки; работы/услуги — инициатор → бухгалтерия → ПЭО → комиссия; медоборудование — зам по направлению → главная медицинская сестра (инициатор по направлению). После всех согласований — подписание УКЭП и генерация PDF.

- Зам по направлению подставляется автоматически по подразделению инициатора (справочник Приложения 3).

### **4.14.2. Справочник инициаторов закупок**

- 17 инициаторов с зонами закупок (Приложение 13): по категории предмета система автоподсказывает инициатора; вручную инициатора может выбрать пользователь с правом.

### **4.14.3. Журнал номеров запросов**

- Автонумерация формата «N-ЭК» с продолжением сквозной нумерации существующего журнала (импорт истории из Excel, разовое требование).

- Поля: номер, дата, краткое наименование закупки, ответственный (инициатор). Номер автоматически проставляется в генерируемый запрос.

### **4.14.4. Запросы на предоставление ценовой информации**

- Генерация по шаблону (Приложение 11): реквизиты организации, наименование, предполагаемый срок и вид закупки, порядок оплаты — по факту, 60 календарных дней (7 рабочих дней для субъектов МСП), отсутствие обеспечения, срок ответа не более 5 рабочих дней.

- Рассылка поставщикам из портала (на e-mail, указанный в карточке поставщика) вместо ручных скриншотов; ответ поставщика прикрепляется к делу закупки.

- Правила КП: до 100 000 ₽ — без ценовой информации; свыше — минимум 3 КП; исключения — гарантирующие поставщики и естественные монополии (по Положению о закупке).

### **4.14.5. Дефектный акт**

- Электронная форма по шаблону (Приложение 10) с автозаполнением из инвентарной карточки медтехники/ПК: организация, подразделение, наименование строго по инвентарной карте, номер и дата акта, комиссия осмотра (должности, ФИО, подписи), М.П.

- Обязателен для: ремонта медоборудования; поставки запчастей/комплектующих для ремонта; ТО оборудования на балансе; текущего ремонта помещений; поставки строительных материалов для ремонта. Связан с ходатайством и заявкой сегмента МедТехника.

### **4.14.6. Дело закупки**

- Единый объект: ходатайство → ТЗ → согласования → рассылка КП → предложения → комиссия по способу закупки (состав ведёт ПЭО, изменяемый) → протокол → договор. Статусы от «ходатайство подано» до «закрыто».

- Техническое задание — конструктор с обязательными диапазонами характеристик (нацрежим); для ТО/поверки/ремонта — обязательные заводской и/или инвентарный номер по каждой позиции; для ремонта помещений — локальная смета.

- Вложения и история изменений по всему делу.

### **4.14.7. Согласование договора (лист согласования)**

- Электронный маршрут по шаблону (Приложение 14): инициатор → юрисконсульт (при флаге «использована типовая форма договора» этап пропускается с автоматической пометкой) → главный бухгалтер (КОСГУ) → ПЭО (источник финансирования из списка: субсидия на госзадание; субсидии по абз. 2 п. 1 ст. 78.1 БК РФ; платные услуги; аренда; родовые сертификаты; ОМС; плюс КОСГУ и КБК) → специалист по закупкам (способ закупки, протокол №, дата размещения в ЕИС).

- Решение: переход на электронный лист согласования с возможностью параллельного ведения в бумажном варианте — система генерирует PDF листа согласования для бумажного дублирования по требованию.

### **4.14.8. Реестр договоров**

- Структура по действующему Excel-реестру: № п/п, № договора, дата заключения, цена, наименование поставщика, срок исполнения, предмет, примечания, статус «отработан».

- Напоминания об окончании срока исполнения за 30/14/7 дней; импорт истории из Excel; связь с делом закупки.

### **4.14.9. Контроль сроков и дисциплины инициаторов**

- Таблица контрольных точек (сроки единые, «не позднее 5 рабочих дней» — решено; точные значения настраиваются администратором в справочнике сроков и могут изменяться): подача ходатайства от подразделения с даты потребности; подача пакетов инициатору; предоставление ТЗ; готовность полного пакета документов; сроки для плановых закупок следующего года (до 1 сентября — ходатайства, до 1 октября — полный пакет).

- Срочные закупки («жизненно угрожающая ситуация») — ускоренные сроки, значения настраиваются.

- Фиксация нарушений сроков инициаторами с указанием нарушенных пунктов инструкций и счётчиком повторов.

- Автоматическое формирование проекта служебной записки (Приложение 17) для рассмотрения на комиссии по начислению стимулирующих выплат по показателю «неисполнение приказов главного врача»; создаёт специалист по закупкам с просмотром и правкой перед отправкой (вопрос о юридическом включении в стимулирующие выплаты — открытый).

### **4.14.10. Карточка поставщика**

- Наименование, ИНН, признак МСП (микро/малое/среднее/нет) — по данным сервиса ФНС (ofd.nalog.ru); признак определяет порядок оплаты: 7 рабочих дней (МСП) или 60 календарных дней.

- Статус «согласен на оплату по факту / требует предоплату» (с обоснованием предоплаты); история договоров и исполнения.

- Подтверждение признака МСП — открытый вопрос (автоматическая проверка по сервису ФНС и/или подтверждение специалистом по закупкам).

### **4.14.11. Библиотека типовых форм договоров и памятка**

- Актуальные версии типовых форм договоров с датой обновления; право редактирования — ПЭО/специалист по закупкам; автоматическая рассылка всем инициаторам при изменении версии (заменяет ручную информационную рассылку).

- Памятка инициатору (Приложение 18): оплата по факту, предупреждение ПЭО о предоплате, проверка МСП через сервис ФНС, работа по типовым формам.

## **4.15. Поручения**

- Из протокола заседаний или вручную: текст поручения, ответственный, срок, статус (выполнено/в работе/просрочено); напоминания; сводка по подразделениям и ответственным.

## **4.16. Центр уведомлений**

- Единая лента всех напоминаний пользователя: заявки, НС, согласования, ходатайства, сроки (пароль, сертификат, аккредитация, поверка, договоры), поручения, смены, дни рождения.

- Индикатор непрочитанных в шапке портала; настройки доставки.

- Канал доставки — только e-mail (решено); дублирование в мессенджеры не реализуется.

## **4.17. Опросы сотрудников**

- Конструктор опросов (одиночный/множественный выбор, шкала, текстовый ответ); анонимные и с подписью; для нужд ВКК и администрации.

- Доступ к результатам (решено): менеджер качества, главный врач, администраторы системы.

## **4.18. Формуляр лекарственных средств (аптека)**

- Справочник наличия ЛС, поддерживаемый аптекой: наименование, форма выпуска, наличие/стандарты, примечания; обновление — аптека; поиск для врачей. Не учёт запасов по приходу/расходу.

## **4.19. Чек-листы аудитов (отдел качества)**

- Шаблоны проверок (санэпидрежим, учрежденческий контроль и др.); заполнение по подразделениям с датой, проверяющим, результатами и фото; сводная отчётность; отличие от тестирования сотрудников: тестируется подразделение, а не работник.

## **4.20. Учёт рабочего времени**

- Отложенный контур: реализуется только при появлении интеграции с 1С:ЗУП; до этого не разрабатывается.

# **5. Нефункциональные требования**

- Безопасность: доступ только по учётным записям, журналирование значимых действий, разграничение прав по ролям (матрица — Приложение «Матрица прав», см. раздел 3), работа в защищённом контуре ViPNet; передача данных по HTTPS.

- 152-ФЗ: минимизация персональных данных; в НС не хранятся данные о здоровье; модель угроз и меры защиты — на стороне заказчика, портал обеспечивает технические меры (шифрование, журналы, резервное копирование).

- Резервное копирование: полный бэкап БД и вложений не реже 1 раза в сутки.

- Показатели восстановления — уточняются заказчиком (открытый вопрос, переформулирован: см. Приложение 4).

- Производительность: отклик интерфейса до 2 с при 100 одновременных пользователях.

- Импорт/экспорт: Excel-выгрузки во всех реестрах; импорт истории — НС, договоров, журнала запросов, справочников (пользователи, подразделения).

- Совместимость: современные браузеры (Chrome, Яндекс.Браузер, Edge); обязательная работоспособность регистрации НС и заявок со смартфона.

# **6. Управление пользователями и доступом**

- Регистрация — ручная: учётные записи создаёт только администратор (самостоятельной регистрации нет); поля: ФИО, подразделение, должность, e-mail, роли.

- Временный пароль генерируется системой и передаётся сотруднику лично или по внутренней почте; при первом входе обязательная смена пароля без доступа к разделам.

- Политика паролей: срок действия 90 дней; уведомление за 7 дней до истечения; принудительная смена при входе по истечении; новый пароль не совпадает с последними 3; минимальная сложность (не менее 8 символов, разные регистры, цифры); при 5 неудачных попытках — блокировка записи на 15 минут.

- Роли назначаются вручную администратором; у пользователя может быть несколько ролей; изменения ролей журналируются (кто, когда, с какой на какую).

- Массовый импорт пользователей из Excel — обязательное разовое требование первой очереди (решено): загрузка списка с автогенерацией временных паролей.

- При увольнении запись деактивируется (не удаляется — сохранение истории).

# **7. Технические рекомендации**

- Веб-приложение с серверной частью в защищённом контуре организации; развертывание согласуется с АСУ.

- СУБД с поддержкой резервного копирования; хранение вложений на файловом хранилище с бэкапом.

- Интеграции: SMTP-рассылки (уведомления), ViPNet «Деловая почта» (каталог МСЭ), КриптоПро CSP + Browser plug-in (УКЭП); архитектурный запас под будущую интеграцию с 1С:ЗУП.

- Исходные коды и документация передаются заказчику; порядок передачи — предмет договора.

# **8. Этапы работ (очереди)**

| **Очередь** | **Состав** | **Примечание** |
| - | - | - |
| 1. MVP (запуск портала) | публичные разделы (телефонный справочник, приказы + ознакомление, СОПы + ознакомление, библиотека НД), HelpDesk 3 сегмента, модуль НС, импорт истории (пользователи, справочники, НС), центр уведомлений, управление пользователями с массовым импортом | запуск в пилотном режиме на 1–2 отделениях (см. раздел 9) |
| 2. Документооборот и закупки | согласование документов с УКЭП (КриптоПро), закупочная деятельность (ходатайства, ТЗ, журнал N-ЭК, запросы цен, дело закупки, лист согласования, реестр договоров, карточки поставщиков, служебные записки), учёт IT-инфраструктуры и склада, учёт медоборудования | наиболее объёмная очередь; требует завершения Приложения 4 |
| 3. Контрольные контуры | связи НС ↔ заявки, поручения, МСЭ, дашборд личных показателей, контроль аккредитации и допусков персонала, АХЧ-инвентарь (пустой справочник) | после отладки очередей 1–2 |
| 4. Комфорт и управленческие модули | опросы, HR-модуль, ГО и ЧС, чек-листы аудитов, протоколы заседаний, формуляр ЛС аптеки, «Я новенький», планировщик дежурств, календарь событий, доска объявлений, учёт рабочего времени (только при интеграции с 1С) | состав уточняется после пилота |


# **9. Критерии приёмки**

- По каждому разделу 4.1–4.20 — контрольный сценарий: создание записи, прохождение маршрута, уведомления, отчёт, экспорт.

- УКЭП: успешное подписание тестового документа реальным сертификатом, корректная реакция на истёкший сертификат, доставки уведомлений 30/14/7/3 дня.

- Импорт истории: контрольные сверки объёмов и выборочные проверки записей.

- Мобильность: полный сценарий регистрации НС и подачи заявки со смартфона.

- Контент-план: до приёмки очереди 1 заказчик назначает ответственных за наполнение каждого раздела; интерфейс позволяет публиковать документы без участия разработчика.

- Пилотный запуск: очереди 1 запускается на 1–2 отделениях (предпочтительно — где активнее всего ведётся НС), 2–4 недели, сбор замечаний, затем тиражирование.

# **Приложение 1. Направления ВКК и БМД (классификатор)**

***Переносится из исходных данных заказчика (актуальность подтверждена отделом качества, решение № 24). Состав: 18 направлений с индексами (1а — лекарственные осложнения, 4b — несвоевременное/неверное выполнение назначений, и т. д. по перечню исходного классификатора).**

# **Приложение 2. Характер нежелательных событий (9 групп)**

***Переносится из исходных данных заказчика: группы 1–9 (поломка медицинского оборудования; неправильная работа систем жизнеобеспечения; инциденты с интернетом; инциденты с МИС (ЕЦП, L2, ТМК и др.); нарушение правил безопасности; утечка конфиденциальной информации; не работает СОП; и иные группы по классификатору).**

# **Приложение 3. Справочник подразделений**

***Построен по распоряжению № 54-1580-мр от 25.06.2026 (действующая редакция). Трёхуровневая выборка: блок (курируемый заместителем главного врача) → подразделение → кабинет/состав. В форме НС: блок → подразделение (со строкой поиска).**

| **Блок (зам. по направлению)** | **Подразделения (сводно)** | **Примечания** |
| - | - | - |
| Амбулаторно-поликлиническая помощь | Поликлиника (Регистратура, 1 и 2 терапевтические отделения, КНМП, ОМП, стоматологическое отделение, кабинеты ПСМП, травматология и ортопедия, КФД, «Школа диабета», смотровой кабинет); Поликлиника п. Жилкино (Регистратура, КТУ, КПУ, кабинеты ПСМП, КФД, «Школа диабета», смотровой, ортопедическая стоматология, стерилизационный, травмпункт № 4, медико-психологическое консультирование, процедурный, врачебная амбулатория); Фельдшерские здравпункты (ФАП) | ФАП включены по решению рабочей группы (есть в структуре 2023 г., подтверждено 23.10.2026); травмпункт № 4 — отдельная единица статистики, не совпадает с кабинетом травматологии Поликлиники |
| Педиатрическая помощь | Детская поликлиника (1 и 2 педиатрические отделения, Регистратура, процедурный кабинет, профилактическое отделение, кабинет здорового ребёнка, отделение организации медпомощи несовершеннолетним, отделение медицинской реабилитации с кабинетами врача по мед. реабилитации, ЛФК, физиотерапии, массажа; дневной стационар; кабинет рентгеновской КТ; КНМП детская; детское стоматологическое; консультативно-диагностический центр с кабинетами специалистов, эндоскопия, УЗИ, КФД, логопед, медпсихолог) | по действующей структуре |
| Акушерско-гинекологическая служба | Женская консультация (Регистратура, доврачебный приём, кабинеты акушеров-гинекологов, терапевта, антенатальной охраны плода, процедурный, операционная, УЗИ, дежурный врач-акушер, КФД, пост централизованной выписки, психопрофилактическая подготовка, психологическая и медико-социальная помощь); Гинекологическое отделение с дневным стационаром; Родильный дом (отделение неонатального профиля, физиологическое отделение новорожденных с палатой РИТ, акушерский стационар: физиологическое отделение с обсервационными койками, анестезиология-реанимация для женщин, патология беременности, акушерский уход) | пост централизованной выписки — подразделение Ж К, не путать с аналогичным постом стационара |
| Медицинская часть (стационар и диагностика) | Приёмное отделение; бактериологическая и клинико-диагностическая лаборатории (КДЛ); эндоскопический кабинет; патологоанатомическое отделение; отделение УЗД; кабинет КФД; физиотерапевтическое отделение; аптека; централизованное стерилизационное отделение (ЦСО); рентгеновское отделение (кабинет, маммографический, стоматологический, остеоденситометрия); терапевтические/хирургические отделения стационара; отделение реанимации и интенсивной терапии для больных с ОНМК; отделение диализа (в редакции 2023 — кабинет, в действующей — отделение) | наименования терапевтических/хирургических отделений стационара — по Приложению 1 распоряжения в полном объёме при импорте |
| Управление и вспомогательные подразделения | Бухгалтерия (главный бухгалтер); отдел кадров; отдел АСУ; планово-экономический отдел; административно-хозяйственное подразделение; пищеблок; гараж; организационно-методическое отделение; отделение платных услуг; отдел качества и БМД | блок добавлен в ТЗ (в старом справочнике отсутствовал); НС от вспомогательных служб регистрируются здесь |


- Примечания по переименованиям для корректного отнесения исторических НС: «кабинет диализа» (2023) → «отделение диализа» (2026); «кабинет остеоденситометрии» → «кабинет рентгеновской остеоденситометрии»; «отделение неотложной травматологии и ортопедии (травмпункт)» (2023) → «кабинет неотложной травматологии и ортопедии (травмпункт № 4)» в Поликлинике п. Жилкино (2026).

- Организационная структура «Медико-хирургический центр» из редакции 2023 г. исключена из справочника (в действующей структуре отсутствует, решение № 23).

- В Word-версии структуры 2023 г. обнаружены дубли строк («1 терапевтическое отделение», «кабинеты ПСМП» Жилкино) — артефакт конвертации, при импорте дубли отфильтровываются.

