# **ТЕХНИЧЕСКОЕ ЗАДАНИЕ**

***на разработку внутреннего портала ОГАУЗ «Медсанчасть ИАПО»**

***Редакция 11 (объединённое ТЗ, с учётом решений рабочей группы от 22–23.10.2026)**

***Статус: согласуется с заказчиком. Открытые вопросы — Приложение 4.**

# **1. Общие сведения**

- Заказчик: ОГАУЗ «Медсанчасть ИАПО», г. Иркутск.

- Основание структуры организации: распоряжение министерства здравоохранения Иркутской области от 25.06.2026 № 54-1580-мр (действующая редакция; предыдущая редакция — распоряжение от 02.08.2023 № 2260-мр).

- Справочник подразделений портала строится по действующей структуре; при изменении структуры приказом/распоряжением — обновляется администратором системы. Решения рабочей группы: фельдшерские здравпункты (ФАП) включены в справочник; организационная структура «Медико-хирургический центр» из редакции 2023 года исключена (в 2026 году отсутствует).

- Портал предназначен только для внутренних пользователей (сотрудников организации). Публичные разделы доступны только после авторизации. Самостоятельная регистрация пользователей отсутствует.

- Машиночитаемая версия структуры (распоряжение № 2260-мр в Word) закреплена как источник данных для первичного импорта справочника подразделений.

# **2. Цели создания портала**

- Единая точка доступа сотрудников к внутренним ресурсам, документам и сервисам организации.

- Снижение доли бумажного документооборота по заявкам, ходатайствам, согласованиям и ознакомлению.

- Систематизация учёта нежелательных событий (НС) и отказ от ведения истории НС в файлах Excel.

- Автоматизация маршрутов согласования документов, включая подписание УКЭП.

- Централизованный контроль сроков: техническое обслуживание и поверка медоборудования, аккредитация и допуски персонала, сертификаты УКЭП, сроки закупочного контура.

